<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Security Dashboard</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1746/1746650.png">    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --accent-blue: #3b82f6; --accent-red: #ef4444; 
            --accent-green: #10b981; --accent-orange: #f59e0b;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; }
        
        /* Menu latéral (Sidebar) */
        .sidebar { width: 250px; background-color: var(--card-bg); border-right: 1px solid var(--border-color); padding: 2rem 1rem; display: flex; flex-direction: column; gap: 10px; }
        .sidebar h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent-blue); text-align: center; margin-bottom: 2rem; }
        .nav-link { color: var(--text-muted); text-decoration: none; padding: 12px 16px; border-radius: 8px; font-weight: 500; transition: 0.2s; }
        .nav-link:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }
        .nav-link.active { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border-left: 4px solid var(--accent-blue); }
        
        /* Contenu principal */
        .main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
        
        .status-badge { display: flex; align-items: center; gap: 8px; background: var(--card-bg); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); font-size: 0.875rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.online { background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .dot.offline { background-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); animation: pulse 2s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-title { margin: 0 0 1.2rem 0; font-size: 0.875rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        
        .tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .tag-bouton { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .tag-ultrason { background: rgba(245, 158, 11, 0.15); color: var(--accent-orange); }
        .tag-son { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2>🛡️ IoT Security</h2>
        <a href="/" class="nav-link" id="nav-dashboard">📊 Dashboard</a>
        <a href="/historique" class="nav-link" id="nav-historique">📋 Historique Complet</a>
        <a href="/parametres" class="nav-link" id="nav-parametres">⚙️ Paramètres</a>
    </nav>

    <main class="main-content">
        <header>
            <h1>{% block titre_page %}Titre par défaut{% endblock %}</h1>
            <div class="status-badge">
                <div class="dot offline" id="status-dot"></div>
                <span id="status-text">Synchronisation...</span>
            </div>
        </header>

        {% block content %}
        {% endblock %}
    </main>

    <script>
        // Activation visuelle du lien courant dans le menu
        const chemin = window.location.pathname;
        if(chemin === '/') document.getElementById('nav-dashboard').classList.add('active');
        if(chemin === '/historique') document.getElementById('nav-historique').classList.add('active');
        if(chemin === '/parametres') document.getElementById('nav-parametres').classList.add('active');

        // Vérification de l'état du système (Ping de l'Arduino)
        async function verifierStatutGlobal() {
            try {
                const reponse = await fetch('/api/etat');
                const data = await reponse.json();
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('status-text');
                
                if (data.en_ligne) {
                    dot.className = 'dot online'; text.innerText = 'Système Opérationnel'; text.style.color = '#f8fafc';
                } else {
                    dot.className = 'dot offline'; text.innerText = 'Liaison Perdue'; text.style.color = '#ef4444';
                }
            } catch (e) {
                document.getElementById('status-dot').className = 'dot offline';
                document.getElementById('status-text').innerText = 'Serveur Injoignable';
            }
        }
        
        verifierStatutGlobal();
        setInterval(verifierStatutGlobal, 3000);
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
