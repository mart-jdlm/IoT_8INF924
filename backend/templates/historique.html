{% extends "layout.html" %}

{% block titre_page %}📋 Historique Complet des Événements{% endblock %}

{% block content %}
<style>
    /* Barre de filtres */
    .filters-container { display: flex; gap: 20px; margin-bottom: 20px; background: var(--card-bg); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border-color); align-items: flex-end; flex-wrap: wrap; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .filter-group input, .filter-group select { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; outline: none; cursor: pointer; }
    
    /* Icône de calendrier blanche pour le mode sombre */
    .filter-group input::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; } 
    
    .btn-load-all { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn-load-all:hover { background-color: var(--accent-blue); color: white; }

    /* Tableau des événements */
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-muted); font-weight: 600; background-color: rgba(255,255,255,0.02); }
    tr:hover { background-color: rgba(255,255,255,0.02); }
    .time-text { color: var(--text-muted); font-family: monospace; font-size: 1rem; }
</style>

<div class="filters-container">
    <div class="filter-group">
        <label>📅 Filtrer par date</label>
        <input type="date" id="filter-date" onchange="appliquerFiltres()">
    </div>
    <div class="filter-group">
        <label>📡 Filtrer par capteur</label>
        <select id="filter-source" onchange="appliquerFiltres()">
            <option value="tout">Tous les événements</option>
            <option value="bouton">🔘 Bouton Manuel</option>
            <option value="infrarouge">🏃 Mouvement Infrarouge</option>
            <option value="son">🔊 Détection Sonore</option>
        </select>
    </div>
    <div class="filter-group" style="margin-left: auto;">
        <button class="btn-load-all" id="btn-load" onclick="chargerHistoriqueComplet()">
            📥 Charger toute la base de données
        </button>
    </div>
</div>

<div class="card">
    <h2 class="card-title" id="table-title">Derniers Événements (Limité à 50)</h2>
    <table>
        <thead>
            <tr>
                <th>Capteur Déclenché</th>
                <th style="text-align: right;">Date & Heure Locales</th>
            </tr>
        </thead>
        <tbody id="donnees">
            <tr><td colspan="2" style="text-align: center; color: var(--text-muted);">Chargement des données...</td></tr>
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Stockage local pour filtrer sans recharger la base
    let toutesLesDonnees = []; 
    let modeComplet = false;

    // Récupération des événements depuis l'API
    async function chargerHistorique(limite = 50) {
        document.getElementById('donnees').innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text-muted);">Chargement depuis la base de données...</td></tr>`;
        const reponse = await fetch(`/api/historique_data?limite=${limite}`);
        toutesLesDonnees = await reponse.json();
        appliquerFiltres();
    }

    // Charge l'intégralité des événements
    function chargerHistoriqueComplet() {
        modeComplet = true;
        document.getElementById('table-title').innerText = "Journal d'Activité (Base de données complète)";
        document.getElementById('btn-load').style.display = 'none';
        chargerHistorique(0);
    }

    // Filtre l'affichage selon la sélection
    function appliquerFiltres() {
        const dateFiltre = document.getElementById('filter-date').value;
        const sourceFiltre = document.getElementById('filter-source').value;
        
        let html = '';
        let compteur = 0;

        toutesLesDonnees.forEach(event => {
            // Extraction de la date (ex: "2024-03-15")
            const dateEvent = event.heure.substring(0, 10);
            
            let correspondDate = (dateFiltre === '') || (dateEvent === dateFiltre);
            let correspondSource = (sourceFiltre === 'tout') || (event.source === sourceFiltre);

            if (correspondDate && correspondSource) {
                compteur++;
                let nomAffiche = event.source === 'bouton' ? 'Bouton Manuel' : (event.source === 'infrarouge' ? 'Mouvement IR' : 'Détection Sonore');
                html += `<tr>
                            <td><span class="tag tag-${event.source}">${nomAffiche}</span></td>
                            <td class="time-text" style="text-align: right;">${event.heure.substring(0, 19)}</td>
                         </tr>`;
            }
        });

        if (compteur === 0) {
            html = `<tr><td colspan="2" style="text-align: center; color: var(--accent-orange); padding: 20px;">Aucun événement ne correspond à votre recherche.</td></tr>`;
        }

        document.getElementById('donnees').innerHTML = html;
    }

    // Chargement initial
    chargerHistorique(50);
    
    // Rafraîchissement automatique (stoppé si l'utilisateur filtre ou visionne la base complète)
    setInterval(() => {
        if (!modeComplet && document.getElementById('filter-date').value === '' && document.getElementById('filter-source').value === 'tout') {
            chargerHistorique(50);
        }
    }, 4000);
</script>
{% endblock %}
